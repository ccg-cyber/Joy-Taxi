<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Joy Taxi — Book a ride</title>
<meta name="theme-color" content="#FFC800">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="map"></div>
<div class="float">
  <a class="chipbar" href="/app/"><img id="mark" alt="" width="40" height="30"><b id="bname"></b></a>
  <button class="round" id="lang" type="button">العربية</button>
</div>

<div class="sheet" id="sheet">
  <div class="grab"></div>

  <!-- PLAN -->
  <div id="plan">
    <button class="fld on" id="fP" type="button"><span class="dot"></span><span><small data-t="from">Pickup</small><b id="vP" class="ph"></b></span></button>
    <button class="fld" id="fD" type="button"><span class="dot sq"></span><span><small data-t="to">Destination</small><b id="vD" class="ph"></b></span></button>
    <p class="hint" id="hint"></p>
    <div class="scroll" id="chips"></div>
    <div class="seg" id="when" style="margin-bottom:10px"><button type="button" data-w="now" class="on" data-t="now">Now</button><button type="button" data-w="later" data-t="later">Later</button></div>
    <input id="time" type="time" hidden style="margin-bottom:10px">
    <div class="cars" id="cars"></div>
    <div class="row2"><input id="phone" type="tel" inputmode="tel" autocomplete="tel" data-p="phone" placeholder="Phone (optional)"><select id="pay"></select></div>
    <div class="sum"><span id="sumL"></span><b id="sumP"></b></div>
    <div class="err" id="err" hidden></div>
    <button class="cta" id="go" type="button" data-t="book">Book my ride</button>
    <p class="fine" data-t="fine">Your request goes straight to our dispatcher. Optional phone lets the driver call you. We keep only what is needed for the ride.</p>
  </div>

  <!-- TRACK -->
  <div id="track" hidden>
    <p class="big" id="tT"></p><p class="sub" id="tS"></p>
    <div class="steps" id="steps"><i></i><i></i><i></i><i></i></div>
    <div class="drv" id="drv" hidden><div class="av" id="av"></div><div><b id="dn"></b><div class="sub" id="dc" style="margin:0"></div></div><span class="plate" id="dp"></span></div>
    <div class="pay" id="payBox" hidden></div>
    <div id="kv"></div>
    <div class="btns" id="tb"></div>
  </div>

  <p class="pw" id="pw"></p>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="brand.js"></script>
<script>
(function () {
'use strict';
var B = window.BRAND, $ = function (s) { return document.querySelector(s); };
var T = {
  en: { from: 'Pickup', to: 'Destination', now: 'Now', later: 'Later', book: 'Book my ride', phone: 'Phone (optional)',
    fine: 'Your request goes straight to our dispatcher. Optional phone lets the driver call you. We keep only what is needed for the ride.',
    hintP: 'Tap the map or a place below to set your pickup.', hintD: 'Now tap where you are going.',
    cash: 'Cash', whish: 'Whish', est: 'Estimated fare', noPrice: 'Price confirmed by dispatcher', km: 'km', near: 'Near ', pin: 'Pinned location', cur: 'My location',
    s_new: 'Finding your driver…', s_new2: 'Dispatch has your request. Hang tight.', s_confirmed: 'Confirmed', s_confirmed2: 'A driver is being assigned.',
    s_assigned: 'Driver on the way', s_arrived: 'Your driver has arrived', s_ontrip: 'Enjoy your ride', s_done: 'Trip complete', s_cancelled: 'Ride cancelled',
    cancel: 'Cancel ride', again: 'Book another', call: 'Call driver', callUs: 'Call dispatch', wa: 'WhatsApp', payTo: 'Pay with Whish to', ride: 'Ride', fare: 'Fare', pickup: 'Pickup', dest: 'To',
    errBoth: 'Pick your pickup and destination first.', errNet: 'Could not reach dispatch (the server may be waking up). Try again or call us.', eta: 'About {m} min away', fixed: 'Fixed price' },
  ar: { from: 'الانطلاق', to: 'الوجهة', now: 'الآن', later: 'لاحقاً', book: 'اطلب مشوارك', phone: 'الهاتف (اختياري)',
    fine: 'طلبك يصل مباشرة إلى المركز. الهاتف اختياري ليتصل بك السائق. نحتفظ فقط بما يلزم للمشوار.',
    hintP: 'المس الخريطة أو مكاناً أدناه لتحديد نقطة الانطلاق.', hintD: 'الآن المس وجهتك.',
    cash: 'نقداً', whish: 'ويش', est: 'الأجرة التقديرية', noPrice: 'يؤكد المركز السعر', km: 'كم', near: 'قرب ', pin: 'موقع محدد', cur: 'موقعي',
    s_new: 'نبحث عن سائق…', s_new2: 'وصل طلبك إلى المركز.', s_confirmed: 'تم التأكيد', s_confirmed2: 'يتم تعيين سائق.',
    s_assigned: 'السائق في الطريق', s_arrived: 'وصل السائق', s_ontrip: 'رحلة سعيدة', s_done: 'انتهى المشوار', s_cancelled: 'تم إلغاء الطلب',
    cancel: 'إلغاء الطلب', again: 'طلب جديد', call: 'اتصل بالسائق', callUs: 'اتصل بالمركز', wa: 'واتساب', payTo: 'ادفع عبر ويش إلى', ride: 'مشوار', fare: 'الأجرة', pickup: 'من', dest: 'إلى',
    errBoth: 'حدد نقطة الانطلاق والوجهة أولاً.', errNet: 'تعذر الوصول إلى المركز (قد يكون الخادم يستيقظ). حاول مجدداً أو اتصل بنا.', eta: 'على بعد {m} دقيقة تقريباً', fixed: 'سعر ثابت' }
};
function ld(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function sv(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
var lang = ld('jt_lang') || ((navigator.language || '').slice(0, 2) === 'ar' ? 'ar' : 'en');
function t(k) { return T[lang][k] || T.en[k] || k; }
var S = { field: 'P', P: null, D: null, car: B.cars[0].key, later: false, pay: 'cash', cfg: null, ride: null, poll: null, drvMk: null, lastDrv: null };

/* ── map ── */
var map = L.map('map', { zoomControl: false, attributionControl: true }).setView(B.map.center, B.map.zoom);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
function icon(c) { return L.divIcon({ className: '', html: '<div class="pin ' + c + '"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }); }
var mkP = null, mkD = null, line = null;
function pad() { return { paddingTopLeft: [20, 70], paddingBottomRight: [20, Math.min(window.innerHeight * .55, $('#sheet').offsetHeight + 20)] }; }
function fit() {
  var pts = []; if (S.P) pts.push([S.P.lat, S.P.lng]); if (S.D) pts.push([S.D.lat, S.D.lng]); if (S.lastDrv) pts.push(S.lastDrv);
  if (pts.length > 1) map.fitBounds(pts, pad()); else if (pts.length) map.setView(pts[0], Math.max(map.getZoom(), 13));
}
function nearName(ll) {
  var best = null, bd = 1e9;
  B.areas.forEach(function (a) { var d = hav(ll, a.ll); if (d < bd) { bd = d; best = a; } });
  return best ? { a: best, d: bd } : null;
}
function hav(a, b) {
  var R = 6371, r = Math.PI / 180, dl = (b[0] - a[0]) * r, dn = (b[1] - a[1]) * r;
  var x = Math.sin(dl / 2) * Math.sin(dl / 2) + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dn / 2) * Math.sin(dn / 2);
  return 2 * R * Math.asin(Math.sqrt(x));
}
function setPlace(which, p) {
  S[which] = p;
  var mk = which === 'P' ? mkP : mkD;
  if (mk) map.removeLayer(mk);
  mk = L.marker([p.lat, p.lng], { icon: icon(which === 'P' ? 'from' : 'to') }).addTo(map);
  if (which === 'P') mkP = mk; else mkD = mk;
  if (line) { map.removeLayer(line); line = null; }
  if (S.P && S.D) line = L.polyline([[S.P.lat, S.P.lng], [S.D.lat, S.D.lng]], { color: '#111114', weight: 3, dashArray: '6 8', opacity: .6 }).addTo(map);
  if (which === 'P' && !S.D) { S.field = 'D'; }
  draw(); fit();
}
function labelFor(ll) {
  var n = nearName(ll); if (!n) return t('pin');
  return n.d < 1.5 ? n.a[lang] : t('near') + n.a[lang];
}
map.on('click', function (e) {
  if (S.ride) return;
  var ll = [e.latlng.lat, e.latlng.lng];
  setPlace(S.field, { lat: ll[0], lng: ll[1], name: labelFor(ll) });
});

/* ── plan UI ── */
function draw() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(function (n) { n.textContent = t(n.getAttribute('data-t')); });
  document.querySelectorAll('[data-p]').forEach(function (n) { n.placeholder = t(n.getAttribute('data-p')); });
  $('#lang').textContent = lang === 'ar' ? 'English' : 'العربية';
  $('#vP').textContent = S.P ? S.P.name : t('hintP').split('.')[0]; $('#vP').className = S.P ? '' : 'ph';
  $('#vD').textContent = S.D ? S.D.name : t('to'); $('#vD').className = S.D ? '' : 'ph';
  $('#fP').classList.toggle('on', S.field === 'P'); $('#fD').classList.toggle('on', S.field === 'D');
  $('#hint').textContent = S.field === 'P' ? t('hintP') : t('hintD');
  var h = '<button class="chip loc" data-loc="1" type="button">📍 ' + t('cur') + '</button>';
  B.areas.forEach(function (a, i) { h += '<button class="chip" data-a="' + i + '" type="button">' + esc(a[lang]) + '</button>'; });
  $('#chips').innerHTML = h;
  $('#cars').innerHTML = B.cars.map(function (c) {
    var p = priceFor(c.key);
    return '<div class="car' + (c.key === S.car ? ' on' : '') + '" data-c="' + c.key + '"><span class="e">' + c.icon + '</span><b>' + esc(c[lang]) + '</b><small>' + (p ? B.currency + p.lo + (p.hi > p.lo ? '–' + p.hi : '') : c.seats + ' 👤') + '</small></div>';
  }).join('');
  var pays = '<option value="cash">' + t('cash') + '</option>'; if (S.cfg && S.cfg.whish && S.cfg.whish.enabled) pays += '<option value="whish">' + t('whish') + '</option>';
  var cur = $('#pay').value || S.pay; $('#pay').innerHTML = pays; $('#pay').value = cur; S.pay = $('#pay').value;
  var p = priceFor(S.car), km = dist();
  $('#sumL').textContent = km ? km.toFixed(1) + ' ' + t('km') + (p && p.fixed ? ' · ' + t('fixed') : '') : '';
  $('#sumP').textContent = p ? B.currency + p.lo + (p.hi > p.lo ? '–' + p.hi : '') : (km ? t('noPrice') : '');
  $('#sumP').style.fontSize = p ? '' : '14px';
  $('#pw').innerHTML = 'Powered by <a href="' + B.powered.url + '" target="_blank" rel="noopener">' + esc(B.powered.name) + '</a> · ' + esc(B.powered.by) + '<a class="c" href="' + B.powered.url + '" target="_blank" rel="noopener">' + esc(B.powered.cta[lang]) + '</a>';
}
function dist() { if (!S.P || !S.D) return 0; return hav([S.P.lat, S.P.lng], [S.D.lat, S.D.lng]) * 1.3; }
function priceFor(car) {
  var r = S.cfg && S.cfg.rates; if (!r || !r.enabled || !S.P || !S.D) return null;
  var airport = B.areas.filter(function (a) { return a.airport; })[0];
  var km = dist(), mult = (r.mult && r.mult[car]) || 1;
  if (airport && r.airport) {
    var near = function (p) { return hav([p.lat, p.lng], airport.ll) < 3; };
    var other = near(S.P) ? S.D : near(S.D) ? S.P : null;
    if (other) { var n = nearName([other.lat, other.lng]); var fx = n && r.airport[n.a.en]; if (fx) { var v = Math.round(fx * mult); return { lo: v, hi: v, fixed: true }; } }
  }
  var v2 = (r.base + r.perKm * km * mult); v2 = Math.max(v2, r.minimum);
  var h = new Date().getHours(), night = r.nightFrom > r.nightTo ? (h >= r.nightFrom || h < r.nightTo) : (h >= r.nightFrom && h < r.nightTo);
  if (night) v2 *= r.nightExtra;
  return { lo: Math.round(v2 * (1 - r.spread)), hi: Math.round(v2 * (1 + r.spread)) };
}
$('#fP').onclick = function () { S.field = 'P'; draw(); };
$('#fD').onclick = function () { S.field = 'D'; draw(); };
$('#chips').onclick = function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.getAttribute('data-loc')) {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function (g) { var ll = [g.coords.latitude, g.coords.longitude]; setPlace(S.field, { lat: ll[0], lng: ll[1], name: labelFor(ll) }); }, function () {}, { enableHighAccuracy: true, timeout: 10000 });
    return;
  }
  var a = B.areas[+b.getAttribute('data-a')]; setPlace(S.field, { lat: a.ll[0], lng: a.ll[1], name: a[lang] });
};
$('#cars').onclick = function (e) { var c = e.target.closest('.car'); if (c) { S.car = c.getAttribute('data-c'); draw(); } };
$('#when').onclick = function (e) {
  var b = e.target.closest('button'); if (!b) return; S.later = b.getAttribute('data-w') === 'later';
  document.querySelectorAll('#when button').forEach(function (x) { x.classList.toggle('on', x === b); }); $('#time').hidden = !S.later;
};
$('#pay').onchange = function () { S.pay = this.value; };
$('#lang').onclick = function () { lang = lang === 'ar' ? 'en' : 'ar'; sv('jt_lang', lang); if (S.P) S.P.name = S.P.name; draw(); if (S.ride) showTrack(); };

/* ── book ── */
$('#go').onclick = function () {
  var er = $('#err'); er.hidden = true;
  if (!S.P || !S.D) { er.textContent = t('errBoth'); er.hidden = false; return; }
  var p = priceFor(S.car), km = dist(), btn = this; btn.disabled = true;
  var body = { pickup: S.P.name, destination: S.D.name, when: S.later && $('#time').value ? $('#time').value : 'now', lat: S.P.lat, lng: S.P.lng, dest_lat: S.D.lat, dest_lng: S.D.lng,
    est_km: km ? +km.toFixed(1) : null, est_text: p ? B.currency + p.lo + (p.hi > p.lo ? '-' + p.hi : '') : (km ? km.toFixed(1) + ' km' : null), vehicle: S.car, phone: $('#phone').value.trim() || null, pay: S.pay, lang: lang };
  fetch(B.api + '/api/rides', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); })
    .then(function (j) {
      S.ride = { id: j.id, token: j.token, status: 'new', pickup: body.pickup, destination: body.destination, est_text: body.est_text, vehicle: body.vehicle, pay: body.pay };
      sv('jt_ride', JSON.stringify({ id: j.id, token: j.token })); sv('jt_phone', body.phone); start();
    })
    .catch(function () { er.innerHTML = esc(t('errNet')) + ' <a href="tel:+9611056677">71 056 677</a>'; er.hidden = false; })
    .then(function () { btn.disabled = false; });
};

/* ── tracking ── */
var ORDER = ['new', 'confirmed', 'assigned', 'arrived', 'ontrip', 'done'];
function start() { $('#plan').hidden = true; $('#track').hidden = false; showTrack(); clearInterval(S.poll); poll(); S.poll = setInterval(poll, 4000); }
function poll() {
  if (!S.ride) return;
  fetch(B.api + '/api/rides/' + S.ride.id + '/status?token=' + encodeURIComponent(S.ride.token)).then(function (r) { if (r.status === 404 || r.status === 403) { reset(); throw 0; } return r.json(); })
    .then(function (j) { var r = j.ride || j; for (var k in r) S.ride[k] = r[k]; showTrack(); }).catch(function () {});
}
function showTrack() {
  var r = S.ride; if (!r) return; var s = r.status;
  $('#tT').innerHTML = (s === 'new' || s === 'confirmed' ? '<span class="pulse"></span>' : '') + esc(t('s_' + s));
  $('#tS').textContent = s === 'new' ? t('s_new2') : s === 'confirmed' ? t('s_confirmed2') : '#' + r.id + ' · ' + (r.est_text || '');
  var ix = Math.max(0, ORDER.indexOf(s)), lvl = s === 'new' || s === 'confirmed' ? 0 : s === 'assigned' ? 1 : s === 'arrived' ? 2 : 3;
  document.querySelectorAll('#steps i').forEach(function (n, i) { n.classList.toggle('on', s !== 'cancelled' && i <= lvl); });
  var hasD = r.driver_name && s !== 'new' && s !== 'cancelled';
  $('#drv').hidden = !hasD;
  if (hasD) { $('#av').textContent = r.driver_name.charAt(0).toUpperCase(); $('#dn').textContent = r.driver_name; $('#dp').textContent = r.driver_plate || ''; $('#dp').hidden = !r.driver_plate;
    var eta = ''; if (r.driver_lat != null && (s === 'assigned') && r.lat != null) { var m = Math.max(1, Math.round(hav([r.driver_lat, r.driver_lng], [r.lat, r.lng]) * 1.3 / 30 * 60)); eta = t('eta').replace('{m}', m); }
    $('#dc').textContent = eta; }
  // driver car on map
  if (r.driver_lat != null && ['assigned', 'arrived', 'ontrip'].indexOf(s) > -1) {
    S.lastDrv = [r.driver_lat, r.driver_lng];
    if (!S.drvMk) { S.drvMk = L.marker(S.lastDrv, { icon: L.divIcon({ className: 'car', html: '<div class="carmk">🚖</div>', iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(map); fit(); }
    else S.drvMk.setLatLng(S.lastDrv);
  } else if (S.drvMk) { map.removeLayer(S.drvMk); S.drvMk = null; S.lastDrv = null; }
  if (r.lat != null && !mkP) { mkP = L.marker([r.lat, r.lng], { icon: icon('from') }).addTo(map); }
  if (r.dest_lat != null && !mkD) { mkD = L.marker([r.dest_lat, r.dest_lng], { icon: icon('to') }).addTo(map); }
  if (!S.fitted && r.lat != null) { S.fitted = 1; var pts = [[r.lat, r.lng]]; if (r.dest_lat != null) pts.push([r.dest_lat, r.dest_lng]); map.fitBounds(pts, pad()); }
  // pay box
  var w = S.cfg && S.cfg.whish, pb = $('#payBox');
  if (s === 'done' && r.pay === 'whish' && w && w.enabled && w.number) { pb.hidden = false; pb.innerHTML = esc(t('payTo')) + '<b dir="ltr">' + esc(w.number) + '</b>' + esc(w.name || '') + (r.est_text ? ' · ' + esc(r.est_text) : ''); } else pb.hidden = true;
  $('#kv').innerHTML = '<div class="kv"><span>' + t('pickup') + '</span><b>' + esc(r.pickup) + '</b></div><div class="kv"><span>' + t('dest') + '</span><b>' + esc(r.destination) + '</b></div>' + (r.vehicle ? '<div class="kv"><span>' + t('ride') + '</span><b>' + esc(r.vehicle) + '</b></div>' : '');
  var b = '';
  if (s === 'new' || s === 'confirmed' || s === 'assigned') b += '<button class="btn" id="cx" type="button">' + t('cancel') + '</button>';
  if (hasD && r.driver_phone) b += '<a class="btn y" href="tel:' + esc(r.driver_phone) + '">' + t('call') + '</a>';
  else if (s !== 'done' && s !== 'cancelled') b += '<a class="btn y" href="tel:+9611056677">' + t('callUs') + '</a>';
  if (s !== 'done' && s !== 'cancelled') b += '<a class="btn" target="_blank" rel="noopener" href="https://wa.me/' + B.wa + '">' + t('wa') + '</a>';
  if (s === 'done' || s === 'cancelled') b += '<button class="btn y" id="again" type="button">' + t('again') + '</button>';
  $('#tb').innerHTML = b;
  if (s === 'done' || s === 'cancelled') clearInterval(S.poll);
}
$('#tb').onclick = function (e) {
  if (e.target.id === 'again') return reset();
  if (e.target.id === 'cx') {
    e.target.disabled = true;
    fetch(B.api + '/api/rides/' + S.ride.id + '/cancel', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify({ token: S.ride.token }) }).then(poll);
  }
};
function reset() {
  clearInterval(S.poll); sv('jt_ride', null); S.ride = null; S.fitted = 0;
  [mkP, mkD, line, S.drvMk].forEach(function (m) { if (m) map.removeLayer(m); }); mkP = mkD = line = S.drvMk = null; S.P = S.D = null; S.field = 'P'; S.lastDrv = null;
  $('#track').hidden = true; $('#plan').hidden = false; map.setView(B.map.center, B.map.zoom); draw();
}

/* ── init ── */
$('#mark').src = B.mark; $('#bname').innerHTML = '<i>' + B.words[0] + '</i> ' + B.words[1];
$('#phone').value = ld('jt_phone');
draw();
fetch(B.api + '/api/config').then(function (r) { return r.json(); }).then(function (c) { S.cfg = c.config || c; draw(); }).catch(function () {});
var saved = ld('jt_ride'); if (saved) { try { var o = JSON.parse(saved); S.ride = { id: o.id, token: o.token, status: 'new', pickup: '…', destination: '' }; start(); } catch (e) { sv('jt_ride', null); } }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { scope: '/app/' }).catch(function () {});
setTimeout(function () { map.invalidateSize(); }, 300);
})();
</script>
</body>
</html>
