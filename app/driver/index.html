<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Joy Taxi — Driver</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFC800">
<link rel="icon" href="../favicon.png" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="../app.css">
</head>
<body>
<div class="page">
  <header class="top">
    <a class="brand" href="/app/driver/"><img id="mk" alt="" width="44" height="34"><b id="bn"></b><em>DRIVER</em></a>
    <button class="pill" id="out" type="button" hidden>Sign out</button>
  </header>

  <section id="login" class="card">
    <h1 class="t">Ready<span>to drive?</span></h1>
    <label class="l">Driver PIN</label><input id="pin" type="password" autocomplete="current-password" placeholder="PIN from dispatch">
    <label class="l">Your name</label><input id="dname" placeholder="e.g. Georges">
    <label class="l">Plate</label><input id="plate" placeholder="e.g. B 123456">
    <div class="err" id="lerr" hidden style="margin-top:12px"></div>
    <button class="cta" id="start" type="button" style="margin-top:14px">Go online</button>
  </section>

  <section id="board" hidden>
    <div class="card" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between">
      <span id="gps" class="tag-s">GPS off</span>
      <span style="display:flex;gap:8px"><button class="pill" id="alerts" type="button">🔔 Enable alerts</button><button class="pill on" id="share" type="button">📍 Sharing</button></span>
    </div>
    <div class="stats" style="grid-template-columns:repeat(3,1fr)"><div><b id="sNew">0</b><small>New requests</small></div><div><b id="sMine">0</b><small>My rides</small></div><div><b id="sAge" style="font-size:20px;padding-top:4px">—</b><small id="sOnT">Live</small></div></div>
    <div class="mapbox"><div class="m" id="m"></div></div>
    <div id="mine"></div>
    <label class="l">Open requests</label>
    <div id="open"></div>
    <p class="fine" id="empty" hidden>No open requests. Keep this screen open — you get a beep, and a notification if alerts are on.</p>
  </section>
</div>
<script src="../vendor/leaflet/leaflet.js"></script>
<script src="../brand.js"></script>
<script>
(function () {
'use strict';
var B = window.BRAND, API = B.api, $ = function (s) { return document.querySelector(s); };
var activeIds = [], pin = '', me = { name: '', plate: '' }, timer = null, lastNew = -1, ac = null, watch = null, sharing = true, myPos = null, lastPost = 0, map = null, mks = {}, meMk = null, wl = null;
function sv(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function ld(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function api(path, body) {
  return fetch(API + path, { method: body ? 'POST' : 'GET', headers: { Authorization: 'Bearer ' + pin, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || r.status); e.status = r.status; throw e; } return j; }); });
}
function beep() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); var o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; g.gain.value = .12; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + .18);
  setTimeout(function () { var o2 = ac.createOscillator(); o2.frequency.value = 1175; o2.connect(g); o2.start(); o2.stop(ac.currentTime + .18); }, 220); if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {} }
function ago(t) { var m = Math.round((Date.now() - new Date(t)) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago'; }
function nav(lat, lng, q) { return lat != null ? 'https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lng + '&travelmode=driving' : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q + ', Lebanon'); }
function hav(a, b) { var R = 6371, r = Math.PI / 180, dl = (b[0] - a[0]) * r, dn = (b[1] - a[1]) * r, x = Math.sin(dl / 2) * Math.sin(dl / 2) + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dn / 2) * Math.sin(dn / 2); return 2 * R * Math.asin(Math.sqrt(x)); }

function card(r) {
  var s = r.status, away = (myPos && r.lat != null) ? ' · ' + hav(myPos, [r.lat, r.lng]).toFixed(1) + ' km away' : '';
  var h = '<div class="card ride"><div style="display:flex;justify-content:space-between;gap:8px"><h3>#' + r.id + ' · ' + esc(r.pickup) + '</h3><span class="tag-s ' + s + '">' + (s === 'ontrip' ? 'on trip' : s) + '</span></div>' +
    '<div class="meta">→ ' + esc(r.destination) + '<br>' + (r.when_text === 'now' ? 'Now' : 'At ' + esc(r.when_text)) + (r.est_text ? ' · ' + esc(r.est_text) : '') + (r.vehicle ? ' · ' + esc(r.vehicle) : '') + (r.pay === 'whish' ? ' · Whish' : r.pay ? ' · Cash' : '') + away + ' · ' + ago(r.created_at) + '</div><div class="btns">';
  if (s === 'new') h += '<button class="btn y" data-a="accept" data-id="' + r.id + '">Accept</button><a class="btn" target="_blank" rel="noopener" href="' + nav(r.lat, r.lng, r.pickup) + '">Map</a>';
  else {
    if (s === 'assigned') h += '<button class="btn y" data-a="arrived" data-id="' + r.id + '">I have arrived</button>';
    if (s === 'arrived') h += '<button class="btn y" data-a="ontrip" data-id="' + r.id + '">Start trip</button>';
    if (s === 'ontrip') h += '<button class="btn y" data-a="done" data-id="' + r.id + '">Complete</button>';
    var dest = s === 'ontrip' && r.dest_lat != null ? nav(r.dest_lat, r.dest_lng, r.destination) : nav(r.lat, r.lng, r.pickup);
    h += '<a class="btn" target="_blank" rel="noopener" href="' + dest + '">Navigate</a>';
    if (r.phone) h += '<a class="btn" href="tel:' + esc(r.phone.replace(/[^\d+]/g, '')) + '">Call</a>';
  }
  return h + '</div></div>';
}
function initMap() {
  if (map) return; map = L.map('m', { zoomControl: false }).setView(B.map.center, B.map.zoom);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
}
function drawMap(rides) {
  initMap(); Object.keys(mks).forEach(function (k) { map.removeLayer(mks[k]); }); mks = {}; var pts = [];
  rides.forEach(function (r) { if (r.lat == null) return; var c = r.status === 'new' ? 'new' : 'act'; mks[r.id] = L.marker([r.lat, r.lng], { icon: L.divIcon({ className: '', html: '<div class="pin ' + c + '"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }) }).addTo(map); pts.push([r.lat, r.lng]); });
  if (myPos) { if (!meMk) meMk = L.marker(myPos, { icon: L.divIcon({ className: '', html: '<div class="carmk">🚖</div>', iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(map); else meMk.setLatLng(myPos); pts.push(myPos); }
  if (pts.length && !drawMap.f) { map.fitBounds(pts, { padding: [30, 30], maxZoom: 14 }); drawMap.f = 1; }
}
function refresh() {
  api('/api/driver/rides').then(function (j) {
    $('#sOnT').textContent = 'Live'; $('#sAge').textContent = new Date().toTimeString().slice(0, 5);
    var mine = j.rides.filter(function (r) { return r.status !== 'new' && r.driver_name === me.name; });
    var open = j.rides.filter(function (r) { return r.status === 'new'; });
    activeIds = mine.filter(function (r) { return ['assigned', 'arrived', 'ontrip'].indexOf(r.status) > -1; }).map(function (r) { return r.id; }); $('#sNew').textContent = open.length; $('#sMine').textContent = mine.length;
    if (lastNew >= 0 && open.length > lastNew) beep(); lastNew = open.length;
    if (!document.activeElement || document.activeElement.tagName !== 'BUTTON') {
      $('#mine').innerHTML = mine.map(card).join(''); $('#open').innerHTML = open.map(card).join(''); $('#empty').hidden = open.length > 0 || mine.length > 0;
    }
    drawMap(mine.concat(open));
  }).catch(function (e) { if (e.status === 401) return signOut('PIN not accepted.'); $('#sOnT').textContent = 'Offline'; });
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('button[data-a]'); if (!b) return;
  var id = b.getAttribute('data-id'), a = b.getAttribute('data-a'); b.disabled = true;
  var p = a === 'accept' ? api('/api/driver/rides/' + id + '/accept', { driver_name: me.name, plate: me.plate }) : api('/api/driver/rides/' + id + '/status', { status: a });
  p.then(refresh, function (er) { if (er.status === 409) alert(a === 'accept' ? 'Another driver took this ride.' : 'That ride changed — refreshed.'); refresh(); });
});

/* live position → rider sees the car move */
function startGps() {
  if (!navigator.geolocation || watch != null) return;
  watch = navigator.geolocation.watchPosition(function (g) {
    myPos = [g.coords.latitude, g.coords.longitude]; $('#gps').textContent = 'GPS on'; $('#gps').className = 'tag-s assigned';
    if (meMk) meMk.setLatLng(myPos);
    var now = Date.now(); if (!sharing || now - lastPost < 4000) return; lastPost = now;
    activeIds.forEach(function (id) { api('/api/driver/rides/' + id + '/pos', { lat: myPos[0], lng: myPos[1], driver_name: me.name }).catch(function () {}); });
  }, function () { $('#gps').textContent = 'GPS blocked'; $('#gps').className = 'tag-s cancelled'; }, { enableHighAccuracy: true, maximumAge: 3000, timeout: 20000 });
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (l) { wl = l; }).catch(function () {}); } catch (e) {}
}
$('#share').onclick = function () { sharing = !sharing; this.classList.toggle('on', sharing); this.textContent = sharing ? '📍 Sharing' : '📍 Paused'; };

/* push alerts */
function b64(s) { var p = '='.repeat((4 - s.length % 4) % 4), r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, function (c) { return c.charCodeAt(0); }); }
$('#alerts').onclick = function () {
  var btn = this;
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) { alert('Alerts need a newer browser. On iPhone: Share → Add to Home Screen, then open from there.'); return; }
  Notification.requestPermission().then(function (p) {
    if (p !== 'granted') throw new Error('denied');
    return Promise.all([navigator.serviceWorker.register('../sw.js', { scope: '/app/' }).then(function () { return navigator.serviceWorker.ready; }), fetch(API + '/api/push/key').then(function (r) { return r.json(); })]);
  }).then(function (a) {
    if (!a[1].key) throw new Error('off');
    return a[0].pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(a[1].key) });
  }).then(function (sub) { return api('/api/push/subscribe', { subscription: sub.toJSON() }); })
    .then(function () { btn.textContent = '🔔 Alerts on'; btn.classList.add('on'); sv('jt_dpush', '1'); })
    .catch(function (e) { alert(e.message === 'denied' ? 'Notifications are blocked in your browser settings.' : 'Could not turn on alerts.'); });
};

function enter() { $('#login').hidden = true; $('#board').hidden = false; $('#out').hidden = false; lastNew = -1; initMap(); setTimeout(function () { map.invalidateSize(); }, 200); startGps(); refresh(); clearInterval(timer); timer = setInterval(refresh, 4000);
  if (ld('jt_dpush')) { $('#alerts').textContent = '🔔 Alerts on'; $('#alerts').classList.add('on'); } }
function signOut(msg) { clearInterval(timer); if (watch != null) { navigator.geolocation.clearWatch(watch); watch = null; } sv('jt_dpin', null); $('#board').hidden = true; $('#login').hidden = false; $('#out').hidden = true; if (msg) { $('#lerr').textContent = msg; $('#lerr').hidden = false; } }
$('#out').onclick = function () { signOut(); };
$('#start').onclick = function () {
  pin = $('#pin').value.trim(); me.name = $('#dname').value.trim(); me.plate = $('#plate').value.trim();
  if (!pin || !me.name) { $('#lerr').textContent = 'Enter the PIN and your name.'; $('#lerr').hidden = false; return; }
  $('#lerr').hidden = true; beep();
  api('/api/driver/rides').then(function () { sv('jt_dpin', pin); sv('jt_dname', me.name); sv('jt_dplate', me.plate); enter(); },
    function (e) { $('#lerr').textContent = e.status === 401 ? 'PIN not accepted.' : 'Could not reach dispatch (server may be waking). Try again.'; $('#lerr').hidden = false; });
};
$('#mk').src = '../logo-mark.png'; $('#bn').innerHTML = '<i>' + B.words[0] + '</i> ' + B.words[1];
$('#dname').value = ld('jt_dname'); $('#plate').value = ld('jt_dplate'); pin = ld('jt_dpin');
if (pin && $('#dname').value) { me.name = $('#dname').value; me.plate = $('#plate').value; enter(); }
})();
</script>
</body>
</html>
